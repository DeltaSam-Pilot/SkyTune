# Builds the Flightsim.to zip and uploads it as an Actions artifact.
# Manual dispatch only. It does not publish a GitHub release and it does not create a tag.
name: Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build SkyTune.exe
        working-directory: source
        run: python -m PyInstaller --onefile --windowed --name SkyTune --icon assets\app.ico --version-file assets\version_info.txt --add-data "assets\app.ico;." --add-data "assets\app.png;assets" --exclude-module email --exclude-module html --exclude-module xml --exclude-module unittest --exclude-module pydoc --exclude-module pydoc_data --exclude-module doctest --exclude-module pdb --exclude-module xmlrpc --exclude-module sqlite3 --exclude-module lib2to3 --exclude-module tkinter.tix --exclude-module tkinter.test --exclude-module test --exclude-module distutils --exclude-module setuptools --exclude-module pip --exclude-module asyncio --exclude-module decimal --exclude-module _decimal --exclude-module _pydecimal --exclude-module fractions --exclude-module statistics --exclude-module lzma --exclude-module _lzma --exclude-module bz2 --exclude-module _bz2 --noconfirm msfs_tweaker.py
      - name: Pack the Flightsim.to zip
        shell: python
        run: |
          import os, zipfile
          root = os.getcwd()
          exe = os.path.join(root, "source", "dist", "SkyTune.exe")
          if not os.path.isfile(exe):
              raise SystemExit("SkyTune.exe was not built")
          dest = os.path.join(root, "SkyTune-1.8.1-flightsim.to.zip")
          skip_dirs = {"dist", "build", "__pycache__", ".git"}
          with zipfile.ZipFile(dest, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for name in ("README.md", "CHANGELOG.md", "DETAILS.md"):
                  zf.write(name, name)
              zf.write(exe, "SkyTune.exe")
              for folder in ("screenshots", "source"):
                  for dirpath, dirnames, filenames in os.walk(folder):
                      dirnames[:] = [d for d in dirnames if d not in skip_dirs]
                      for filename in filenames:
                          if filename.endswith((".pyc", ".pyo", ".spec")):
                              continue
                          path = os.path.join(dirpath, filename)
                          arc = path.replace("\\", "/")
                          zf.write(path, arc)
          print(dest, os.path.getsize(dest))
      - uses: actions/upload-artifact@v4
        with:
          name: SkyTune-1.8.1-flightsim.to
          path: SkyTune-1.8.1-flightsim.to.zip
          if-no-files-found: error
